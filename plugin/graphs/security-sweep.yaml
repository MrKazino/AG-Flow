id: security-sweep
version: 1
title: Security sweep
description: Parallel code audit and dependency audit, prioritised triage, human-approved remediation of critical/high findings, verification with a rework gate, and a final security report.
inputs:
  scope:
    type: string
    default: "."
    description: Paths or services in scope
defaults:
  retries: 1
  timeout_min: 60
  max_parallel: 2
nodes:
  - id: code-audit
    title: Code & configuration audit
    agent: security-auditor
    skill: security-audit
    prompt: |
      Audit {{ inputs.scope }} for vulnerabilities (attack surface, OWASP classes, secrets, misconfiguration).
      Write the findings report to the expected output path. Do not change code.
    outputs: ["docs/security/{{ run.id }}-code.md"]
    evidence: required

  - id: dependency-audit
    title: Dependency audit
    agent: security-auditor
    skill: dependency-audit
    prompt: |
      Audit third-party dependencies in {{ inputs.scope }} for CVEs and license risks.
      Write the report to the expected output path. Do not upgrade anything yet.
    outputs: ["docs/security/{{ run.id }}-deps.md"]
    evidence: required

  - id: verify-findings
    title: Check the findings are real
    agent: verifier
    skill: verify-claims
    depends_on: [code-audit, dependency-audit]
    prompt: |
      Check every finding in {{ nodes["code-audit"].outputs[0] }} and {{ nodes["dependency-audit"].outputs[0] }}
      against the code and the lockfiles: does the cited file and line exist and contain what the finding describes,
      is the dependency version really the one in use? Write the ledger, one row per finding, to the expected output
      path. A refuted finding is the result, not a failure: report `succeeded` once every finding has a row, and
      `failed` only if you could not check most of them.
    outputs: ["docs/security/{{ run.id }}-verification.md"]
    evidence: required
    checks:
      - {file: "docs/security/{{ run.id }}-verification.md", contains: ["| Claim |", "Verdict:"], min_bytes: 120}

  - id: triage
    title: Prioritise findings
    agent: architect
    depends_on: [code-audit, dependency-audit, verify-findings]
    prompt: |
      Merge and de-duplicate the findings in {{ nodes["code-audit"].outputs[0] }} and
      {{ nodes["dependency-audit"].outputs[0] }}, keeping only those the verification ledger
      {{ nodes["verify-findings"].outputs[0] }} did not refute; list refuted ones under "Dismissed (not reproduced)"
      with the reason. Produce a prioritised remediation plan: critical/high items with concrete fixes and effort;
      medium/low as backlog. Save it to the expected output path.
    outputs: ["docs/security/{{ run.id }}-plan.md"]
    evidence: required

  - id: approve-remediation
    type: human
    depends_on: [triage]
    prompt: "Security triage is ready (see the plan in docs/security/). Approve remediation of the critical/high findings?"

  - id: remediate
    title: Fix critical/high findings
    agent: implementer
    depends_on: [approve-remediation]
    prompt: |
      Fix the critical and high items from {{ nodes.triage.outputs[0] }}, one at a time, each with a
      regression test where feasible. Keep dependency upgrades minimal (patch/minor first). Run the full suite.

  - id: verify
    title: Verify remediation
    agent: security-auditor
    depends_on: [remediate]
    prompt: |
      Re-test every critical/high finding from {{ nodes.triage.outputs[0] }} against the current code and
      look for sibling instances. Report `rejected` if any remains exploitable.

  - id: gate
    type: gate
    depends_on: [verify]
    on_fail: {goto: remediate, max_loops: 2}

  - id: report
    title: Final security report
    agent: researcher
    skill: docs-writer
    depends_on: [gate]
    prompt: |
      Write the final security report: scope, tools run, findings by severity with status (fixed / accepted /
      backlog), and recommendations. Use the audit and plan documents as sources.
    outputs: ["docs/security/{{ run.id }}-report.md"]
    evidence: required
