[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agflow"
version = "0.2.0"
description = "Senior Workflows Manager for Google Antigravity: master prompt, skills, subagents, hooks, graph orchestration (MCP + SDK) and a manager app."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "MrKazino" }]
keywords = ["antigravity", "gemini", "agents", "mcp", "skills", "orchestration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "ruamel.yaml>=0.18",
  "jinja2>=3.1",
  "filelock>=3.13",
  "mcp>=2.0,<3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
sdk = ["google-antigravity>=0.1.20"]

[project.scripts]
agflow = "agflow.__main__:main"

[project.urls]
Homepage = "https://github.com/MrKazino/google-antigravity-workflow"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/agflow"]

[tool.hatch.build.targets.wheel.force-include]
"plugin" = "agflow/_plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
